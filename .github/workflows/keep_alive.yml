name: Keep Streamlit App Awake

on:
  schedule:
    # Ping every 6 hours to prevent Streamlit Cloud from going to sleep
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL https://synapvoxai.streamlit.app/ > /dev/null
          echo "Successfully pinged SynapVox.ai Streamlit App at $(date)"
