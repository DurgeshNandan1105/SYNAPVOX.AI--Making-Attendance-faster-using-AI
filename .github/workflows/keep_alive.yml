name: Keep Streamlit App Awake

on:
  schedule:
    # Ping every 6 hours to prevent Streamlit Cloud from going to sleep
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-redirs 5 https://synapvoxai.streamlit.app/ || echo "Redirected")
          echo "Successfully pinged SynapVox.ai Streamlit App at $(date) (HTTP Status: $STATUS_CODE)"
